
      - name: Build APK
        run: |
          npm install @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html manifest.json service-worker.js icon.svg www/
          npx cap init "4K Enhance Ultra" "com.nirupamlyricx.enhance" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

